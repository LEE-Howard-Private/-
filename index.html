<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>真心話大冒險扭蛋機</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&family=Noto+Sans+TC:wght@700;900&display=swap">
<style>
/* Layout: one comic panel holding the machine, focus-line reveal overlay with a treasure chest */
:root{
  --ink:#1b1a2e;
  --sky:#8fd3ff;
  --paper:#fffdf5;
  --yellow:#ffd43b;
  --truth:#1d8fe3;
  --dare:#ec3a2e;
  --chest:#b8682c;
  --gold:#ffc61a;
  --f-display:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --f-body:"Huninn","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{
  background-color:var(--sky);
  background-image:radial-gradient(rgba(255,255,255,.6) 1.6px,transparent 1.9px);
  background-size:14px 14px;
  color:var(--ink);
  font-family:var(--f-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:18px 40px;
  min-height:100%;
}
.wrap{max-width:580px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1{
  margin:0;text-align:center;font-family:var(--f-display);font-weight:900;
  font-size:clamp(34px,9vw,60px);line-height:1.1;letter-spacing:.02em;
  display:flex;justify-content:center;align-items:center;gap:.15em;flex-wrap:wrap;
}
h1 .w{-webkit-text-stroke:.16em var(--ink);paint-order:stroke fill;text-shadow:.08em .08em 0 var(--ink)}
h1 .t{color:#fff;background:none}
h1 .t1{color:#bfe6ff}
h1 .t2{color:#ffc9c4}
h1 .vs{
  font-size:.42em;color:var(--ink);background:var(--yellow);border:4px solid var(--ink);
  width:2.3em;height:2.3em;display:grid;place-items:center;transform:rotate(-12deg);
  clip-path:polygon(50% 0,61% 22%,85% 12%,78% 38%,100% 50%,78% 62%,85% 88%,61% 78%,50% 100%,39% 78%,15% 88%,22% 62%,0 50%,22% 38%,15% 12%,39% 22%);
  padding:0;
}
.sub{margin:-6px 0 0;text-align:center;font-size:17px}
.sub b{background:#fff;border:3px solid var(--ink);border-radius:999px;padding:2px 12px;box-shadow:3px 3px 0 var(--ink)}
.panel{
  background:var(--paper);border:4px solid var(--ink);border-radius:8px;
  box-shadow:8px 8px 0 var(--ink);padding:10px 10px 18px;
  background-image:radial-gradient(rgba(27,26,46,.08) 1.2px,transparent 1.4px);background-size:9px 9px;
}
canvas{display:block;width:100%;max-width:100%;aspect-ratio:600/680;height:auto}
.controls{display:flex;align-items:center;justify-content:center;gap:16px;flex-wrap:wrap;margin-top:4px}
.chip{
  font-family:var(--f-display);font-weight:900;font-size:17px;color:#fff;
  border:3px solid var(--ink);border-radius:999px;padding:6px 14px;box-shadow:3px 3px 0 var(--ink);
  display:flex;align-items:baseline;gap:6px;font-variant-numeric:tabular-nums;min-width:118px;justify-content:center
}
.chip.truth{background:var(--truth)}
.chip.dare{background:var(--dare)}
.chip span{font-size:24px}
.go{
  width:112px;height:112px;border-radius:50%;border:5px solid var(--ink);background:var(--yellow);
  box-shadow:6px 6px 0 var(--ink);cursor:pointer;font-family:var(--f-display);font-weight:900;
  font-size:40px;color:#fff;-webkit-text-stroke:7px var(--ink);paint-order:stroke fill;
  transition:transform .08s,box-shadow .08s;position:relative;
}
.go small{display:block;font-size:14px;-webkit-text-stroke:0;color:var(--ink);margin-top:-4px}
.go:hover{transform:translate(-1px,-1px) rotate(-4deg)}
.go:active{transform:translate(5px,5px);box-shadow:1px 1px 0 var(--ink)}
.go:disabled{background:#e4e1d6;cursor:default;transform:none}
.go:focus-visible,.btn:focus-visible,.chest:focus-visible{outline:4px dashed var(--truth);outline-offset:4px}
.mini{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:12px}
.btn{
  font-family:var(--f-body);font-size:16px;color:var(--ink);background:#fff;border:3px solid var(--ink);
  border-radius:10px;padding:7px 14px;box-shadow:3px 3px 0 var(--ink);cursor:pointer
}
.btn:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
.btn.primary{background:var(--yellow);font-family:var(--f-display);font-weight:900;font-size:19px}
.note{text-align:center;font-size:14px;margin:0;opacity:.8}

/* ===== Reveal overlay ===== */
#reveal{
  position:fixed;inset:0;z-index:50;display:grid;place-items:center;overflow:hidden;background:#fff3c4;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
}
.rays{
  position:absolute;left:50%;top:50%;width:220vmax;height:220vmax;margin:-110vmax 0 0 -110vmax;
  background:repeating-conic-gradient(from 0deg,#ffd43b 0 9deg,#fff8d6 9deg 18deg);
  animation:spinr 22s linear infinite;
}
.focus{
  position:absolute;inset:-10%;
  background:repeating-conic-gradient(from 3deg at 50% 50%,var(--ink) 0 .7deg,transparent .7deg 6deg);
  -webkit-mask-image:radial-gradient(circle at 50% 50%,transparent 30%,#000 72%);
  mask-image:radial-gradient(circle at 50% 50%,transparent 30%,#000 72%);
  opacity:0;transition:opacity .2s;
}
#reveal.opened .focus{opacity:.85}
#reveal.opened .rays{animation-duration:5s}
@keyframes spinr{to{transform:rotate(360deg)}}
.stage{position:relative;width:min(560px,100%);height:min(620px,92vh);display:grid;place-items:center}
.sfx{
  position:absolute;top:6%;right:4%;font-family:var(--f-display);font-weight:900;font-size:clamp(34px,9vw,54px);
  color:#fff;-webkit-text-stroke:8px var(--ink);paint-order:stroke fill;transform:rotate(12deg);
  text-shadow:4px 4px 0 var(--ink);pointer-events:none;opacity:0
}
.sfx.left{right:auto;left:4%;top:auto;bottom:16%;transform:rotate(-10deg)}
.sfx.pop{animation:sfxpop .5s cubic-bezier(.2,1.8,.4,1) forwards}
@keyframes sfxpop{0%{opacity:0;scale:.3}100%{opacity:1;scale:1}}

.chest-wrap{perspective:800px;position:relative;display:grid;place-items:center;gap:22px}
.chest{
  position:relative;width:min(240px,62vw);aspect-ratio:240/210;max-width:100%;background:none;border:0;padding:0;
  cursor:pointer;transform-style:preserve-3d;
}
.chest .shadow{position:absolute;left:6%;right:6%;bottom:-16px;height:22px;border-radius:50%;background:rgba(27,26,46,.35)}
.chest .body{
  position:absolute;left:0;right:0;bottom:0;height:56%;border:5px solid var(--ink);border-radius:6px 6px 14px 14px;
  background:
    linear-gradient(90deg,transparent 0 13%,var(--gold) 13% 21%,transparent 21% 79%,var(--gold) 79% 87%,transparent 87%),
    repeating-linear-gradient(180deg,var(--chest) 0 30%,#94501f 30% 33%);
  box-shadow:inset -14px -10px 0 rgba(0,0,0,.18),7px 7px 0 var(--ink);
}
.chest .body::after{
  content:"";position:absolute;left:13%;right:13%;top:0;bottom:0;
  background-image:radial-gradient(rgba(0,0,0,.25) 1.3px,transparent 1.5px);background-size:7px 7px;
  -webkit-mask-image:linear-gradient(90deg,transparent 40%,#000);mask-image:linear-gradient(90deg,transparent 40%,#000)
}
.chest .lock{
  position:absolute;left:50%;top:-14px;width:46px;height:52px;margin-left:-23px;z-index:3;
  background:var(--gold);border:4px solid var(--ink);border-radius:8px 8px 18px 18px;
}
.chest .lock::after{content:"";position:absolute;left:50%;top:14px;width:10px;height:18px;margin-left:-5px;background:var(--ink);border-radius:5px 5px 2px 2px}
.chest .lid{
  position:absolute;left:-4%;right:-4%;bottom:53%;height:47%;transform-origin:50% 100%;
  transition:transform .55s cubic-bezier(.25,1.6,.5,1);z-index:2;
  border:5px solid var(--ink);border-radius:50% 50% 8px 8px/80% 80% 8px 8px;
  background:
    linear-gradient(90deg,transparent 0 15%,var(--gold) 15% 22%,transparent 22% 78%,var(--gold) 78% 85%,transparent 85%),
    linear-gradient(180deg,#d68340,var(--chest));
  box-shadow:inset 0 10px 0 rgba(255,255,255,.25),inset -14px 0 0 rgba(0,0,0,.15);
}
.chest .inner{
  position:absolute;left:4%;right:4%;bottom:50%;height:16%;border-radius:50%;
  background:radial-gradient(ellipse,#fff 0,#fff6b0 40%,#ffb300 100%);opacity:0;transition:opacity .2s;
}
.chest .beam{
  position:absolute;left:-30%;right:-30%;bottom:52%;height:260%;transform-origin:50% 100%;
  background:linear-gradient(0deg,rgba(255,255,255,.95),rgba(255,248,190,.5) 50%,transparent);
  clip-path:polygon(38% 100%,62% 100%,100% 0,0 0);transform:scaleY(0);transition:transform .45s ease-out;pointer-events:none
}
.chest.drop{animation:drop .7s cubic-bezier(.3,1.5,.5,1) both}
@keyframes drop{0%{transform:translateY(-90vh) rotate(-10deg)}70%{transform:translateY(0) scale(1.08,.9)}100%{transform:translateY(0) scale(1)}}
.chest.shake{animation:shake 1.1s ease-in-out infinite}
@keyframes shake{
  0%,40%,100%{transform:rotate(0)}
  5%{transform:rotate(-7deg) translateY(-6px)}10%{transform:rotate(7deg) translateY(-6px)}
  15%{transform:rotate(-5deg)}20%{transform:rotate(5deg)}25%{transform:rotate(0) scale(1.06,.94)}
}
.chest.open{animation:openpop .4s ease-out both}
@keyframes openpop{0%{transform:scale(1)}40%{transform:scale(1.12,.88)}100%{transform:scale(1)}}
.chest.open .lid{transform:rotateX(118deg)}
.chest.open .inner{opacity:1}
.chest.open .beam{transform:scaleY(1)}
.chest.gone{opacity:0;transform:translateY(60px) scale(.8);transition:opacity .35s,transform .35s}
.qmark{
  position:absolute;font-family:var(--f-display);font-weight:900;font-size:40px;color:var(--truth);
  -webkit-text-stroke:6px var(--ink);paint-order:stroke fill;animation:bob 1.1s ease-in-out infinite
}
.qmark.a{left:-18%;top:6%;transform:rotate(-16deg)}
.qmark.b{right:-16%;top:-4%;color:var(--dare);animation-delay:.3s;transform:rotate(14deg)}
@keyframes bob{50%{translate:0 -10px}}
.chest.open .qmark,.chest.drop .qmark{display:none}
.hint{
  font-family:var(--f-display);font-weight:900;font-size:20px;background:#fff;border:3px solid var(--ink);
  border-radius:999px;padding:6px 18px;box-shadow:3px 3px 0 var(--ink);margin:0;transition:opacity .2s
}

.card{
  position:absolute;width:min(500px,100%);background:#fff;border:5px solid var(--ink);border-radius:12px;
  box-shadow:10px 10px 0 var(--ink);padding:26px 22px 22px;display:flex;flex-direction:column;gap:16px;
  opacity:0;transform:translateY(120px) scale(.2) rotate(-8deg);pointer-events:none;
  transition:transform .6s cubic-bezier(.2,1.5,.4,1),opacity .2s;
}
.card.show{opacity:1;transform:none;pointer-events:auto}
.card::before{
  content:"";position:absolute;inset:0;border-radius:7px;pointer-events:none;
  background-image:radial-gradient(var(--type) 1.4px,transparent 1.7px);background-size:10px 10px;opacity:.18;
  -webkit-mask-image:linear-gradient(160deg,#000,transparent 45%);mask-image:linear-gradient(160deg,#000,transparent 45%)
}
.card-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.badge{
  font-family:var(--f-display);font-weight:900;font-size:clamp(30px,8vw,40px);color:#fff;background:var(--type);
  border:4px solid var(--ink);padding:2px 18px 6px;transform:rotate(-5deg);box-shadow:5px 5px 0 var(--ink);
  -webkit-text-stroke:6px var(--ink);paint-order:stroke fill;margin-top:-44px;margin-left:-6px
}
.no{font-family:var(--f-display);font-weight:900;font-size:18px;border:3px solid var(--ink);border-radius:999px;padding:2px 12px;font-variant-numeric:tabular-nums}
.q{margin:0;font-size:clamp(23px,5.6vw,30px);line-height:1.5;text-wrap:balance;position:relative}
.rule{margin:0;font-size:16px;color:var(--type);font-family:var(--f-display);font-weight:900}
.card-actions{display:flex;gap:10px;flex-wrap:wrap}
.card-actions .primary{flex:1 1 200px}
.conf{position:absolute;left:50%;top:50%;width:16px;height:16px;pointer-events:none;
  clip-path:polygon(50% 0,63% 36%,100% 38%,70% 60%,80% 100%,50% 76%,20% 100%,30% 60%,0 38%,37% 36%)}

@media (prefers-reduced-motion:reduce){
  .rays,.qmark,.chest.shake{animation:none}
  .card,.chest .lid{transition-duration:.15s}
}
</style>
</head>
<body style="margin:0">

<div class="wrap">
  <header>
    <h1><span class="w t1">真心話</span><span class="vs">VS</span><span class="w t2">大冒險</span></h1>
  </header>
  <p class="sub"><b>扭蛋機 · 20 顆蛋，抽完不重複</b></p>

  <section class="panel" aria-label="扭蛋機">
    <canvas id="machine" width="600" height="680" aria-label="透明八角扭蛋機，裡面有彩色扭蛋"></canvas>
    <div class="controls">
      <div class="chip truth">真心話 <span id="cT">10</span></div>
      <button class="go" id="go" aria-label="轉動扭蛋機">轉！<small id="goSub">按我抽</small></button>
      <div class="chip dare">大冒險 <span id="cD">10</span></div>
    </div>
    <div class="mini">
      <button class="btn" id="reset">重新裝填 20 顆</button>
      <button class="btn" id="snd" aria-pressed="true">音效：開</button>
      <button class="btn" id="mus" aria-pressed="true">音樂：開</button>
    </div>
  </section>
  <p class="note">按空白鍵也能轉 · 抽到不適合的題目可以放回去重抽</p>
</div>

<div id="reveal" hidden>
  <div class="rays"></div>
  <div class="focus"></div>
  <div class="stage">
    <div class="sfx" id="sfxTop">碰！</div>
    <div class="sfx left" id="sfxLeft">登登！</div>
    <div class="chest-wrap" id="chestWrap">
      <button class="chest" id="chest" aria-label="打開寶箱">
        <span class="shadow"></span>
        <span class="beam"></span>
        <span class="inner"></span>
        <span class="body"></span>
        <span class="lid"></span>
        <span class="lock"></span>
        <span class="qmark a">?</span>
        <span class="qmark b">!</span>
      </button>
      <p class="hint" id="hint">點寶箱打開！</p>
    </div>
    <div class="card" id="card" role="dialog" aria-labelledby="qtext">
      <div class="card-head"><span class="badge" id="badge">真心話</span><span class="no" id="no">No.01</span></div>
      <p class="q" id="qtext"></p>
      <p class="rule" id="rule"></p>
      <div class="card-actions">
        <button class="btn primary" id="done">完成，下一位！</button>
        <button class="btn" id="putback">放回去重抽</button>
      </div>
    </div>
  </div>
</div>

<script>
(()=>{
const QUESTIONS=[
  {t:'truth',q:'你最喜歡自己哪兩個優點？'},
  {t:'truth',q:'你有沒有做過什麼芳如老師沒有發現過的？'},
  {t:'truth',q:'說出芳如老師的 5 個優點'},
  {t:'truth',q:'在場誰如果當你爸／媽你會最崩潰？（要說一個原因）'},
  {t:'truth',q:'如果下一節課是空堂，你最想上什麼課？'},
  {t:'truth',q:'在場誰的聊天紀錄你最想看？'},
  {t:'truth',q:'今天外星人突襲高三甲班，但你只能從教室救出一個異性，你會救誰？'},
  {t:'truth',q:'說出自己的三個缺點'},
  {t:'truth',q:'最討厭的老師是誰？'},
  {t:'truth',q:'你願意學測四科 30 級分，但是換來班導的健康嗎？'},
  {t:'dare',q:'走到某個人面前，深情地牽起他的手說：「我深深地愛上你了」'},
  {t:'dare',q:'10 秒內試著舔到自己的手肘'},
  {t:'dare',q:'選一個人，在他面前擺出你覺得最性感的 pose'},
  {t:'dare',q:'現場打給媽媽或爸爸說「我愛你」，開擴音'},
  {t:'dare',q:'在黑板寫「我是全班最帥／美的人」然後簽名，保留到下一個老師來上課'},
  {t:'dare',q:'一口把一瓶水喝完，失敗了班導多出一項作業／一份考卷給你'},
  {t:'dare',q:'發便利貼說：「寶寶我會愛你一輩子的」'},
  {t:'dare',q:'同學用你手機幫你拍一張照片發限動，24 小時內不能刪'},
  {t:'dare',q:'說出你一模跟二模，還有一段的國文成績'},
  {t:'dare',q:'發微笑自拍限動，配上文字寫：「三模車爛大家」'}
];
const INK='#1b1a2e';
const COLORS=[['#ffc2dc','#e0508f'],['#fff2a6','#e9b400'],['#c4f5cf','#2db45c'],['#c6e8ff','#2c86dd'],
              ['#ffd3ad','#ec7424'],['#e3d1ff','#8656dc'],['#bff3ee','#16a89a'],['#ffffff','#aeb6c4']];
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const FONT='"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif';

const cv=document.getElementById('machine'),ctx=cv.getContext('2d');
const W=600,H=680;
function fit(){const d=Math.min(2,window.devicePixelRatio||1);cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0);}
fit();addEventListener('resize',fit);

// halftone pattern
const pc=document.createElement('canvas');pc.width=pc.height=8;
const pg=pc.getContext('2d');pg.fillStyle='rgba(27,26,46,.28)';
pg.beginPath();pg.arc(2,2,1.3,0,7);pg.moveTo(7.3,6);pg.arc(6,6,1.3,0,7);pg.fill();
const DOTS=ctx.createPattern(pc,'repeat');

const C={x:300,y:262},R=198,A=R*Math.cos(Math.PI/8),r=25,D={x:30,y:-24};
const LIM=A-7-r,NX=[],NY=[];
for(let k=0;k<8;k++){NX.push(Math.cos(k*Math.PI/4));NY.push(Math.sin(k*Math.PI/4));}
const S={x:296,y:466},E={x:116,y:588},P1={x:300,y:C.y+A-r-4};

let balls=[],rot=0,omega=0,state='idle',spinT=0,settle=null,pulling=null,trayBall=null,current=null,lastTick=0;
let sfxText=null;

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;}

function fill(){
  const order=shuffle([...Array(20).keys()]);
  const pts=[];
  for(let row=0,y=-A;y<A;y+=r*1.78,row++){
    for(let x=-A+(row%2?r+1:0);x<A;x+=2*r+2){
      let ok=true;for(let k=0;k<8;k++){if(x*NX[k]+y*NY[k]>LIM){ok=false;break;}}
      if(ok)pts.push({x,y});
    }
  }
  pts.sort((a,b)=>b.y-a.y);
  balls=[];
  for(let i=0;i<20;i++){
    const p=pts[i],c=COLORS[i%COLORS.length];
    balls.push({n:i+1,x:p.x+(Math.random()-.5)*4,y:p.y,vx:0,vy:0,a:Math.random()*6,light:c[0],dark:c[1],q:QUESTIONS[order[i]]});
  }
  shuffle(balls); // mix number order spatially
  for(let i=0;i<240;i++)step(1/240);
  trayBall=null;counts();
}

function step(h){
  const G=1700,gx=G*Math.sin(rot),gy=G*Math.cos(rot);
  for(const b of balls){
    b.vx+=gx*h;b.vy+=gy*h;
    if(state==='spin'){b.vx+=(Math.random()-.5)*900*h;b.vy+=(Math.random()-.5)*900*h;}
    b.vx*=.9995;b.vy*=.9995;
    b.x+=b.vx*h;b.y+=b.vy*h;b.a+=b.vx*h/r*.6;
  }
  for(let it=0;it<2;it++){
    for(let i=0;i<balls.length;i++){
      const b1=balls[i];
      for(let j=i+1;j<balls.length;j++){
        const b2=balls[j],dx=b2.x-b1.x,dy=b2.y-b1.y,d2=dx*dx+dy*dy;
        if(d2<4*r*r&&d2>1e-6){
          const d=Math.sqrt(d2),nx=dx/d,ny=dy/d,ov=(2*r-d)/2;
          b1.x-=nx*ov;b1.y-=ny*ov;b2.x+=nx*ov;b2.y+=ny*ov;
          const rv=(b2.vx-b1.vx)*nx+(b2.vy-b1.vy)*ny;
          if(rv<0){const jj=-1.3*rv/2;b1.vx-=jj*nx;b1.vy-=jj*ny;b2.vx+=jj*nx;b2.vy+=jj*ny;}
        }
      }
    }
    for(const b of balls){
      for(let k=0;k<8;k++){
        const nx=NX[k],ny=NY[k],d=b.x*nx+b.y*ny;
        if(d>LIM){
          b.x-=nx*(d-LIM);b.y-=ny*(d-LIM);
          const vn=b.vx*nx+b.vy*ny;
          if(vn>0){b.vx-=nx*vn*1.35;b.vy-=ny*vn*1.35;}
          const tx=-ny,ty=nx,vt=b.vx*tx+b.vy*ty,f=vt*.05;
          b.vx-=tx*f;b.vy-=ty*f;
        }
      }
    }
  }
}

function toWorld(b){const c=Math.cos(rot),s=Math.sin(rot);return{x:C.x+b.x*c-b.y*s,y:C.y+b.x*s+b.y*c};}
function poly(pts,fillStyle,lw=4,stroke=INK){
  ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath();
  if(fillStyle){ctx.fillStyle=fillStyle;ctx.fill();}
  if(lw){ctx.lineWidth=lw;ctx.lineJoin='round';ctx.strokeStyle=stroke;ctx.stroke();}
}
function oct(cx,cy,rad,ang){const a=[];for(let k=0;k<8;k++){const t=ang+Math.PI/8+k*Math.PI/4;a.push([cx+rad*Math.cos(t),cy+rad*Math.sin(t)]);}return a;}

function drawBall(x,y,b,ang,scale=1){
  ctx.save();ctx.translate(x,y);ctx.scale(scale,scale);
  const g=ctx.createRadialGradient(-r*.38,-r*.42,r*.08,0,0,r);
  g.addColorStop(0,'#fff');g.addColorStop(.3,b.light);g.addColorStop(1,b.dark);
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,r,0,7);ctx.fill();
  // manga hatching on the shadow side
  ctx.save();ctx.clip();ctx.fillStyle=DOTS;ctx.beginPath();ctx.arc(r*.55,r*.55,r*.85,0,7);ctx.fill();ctx.restore();
  ctx.lineWidth=3;ctx.strokeStyle=INK;ctx.beginPath();ctx.arc(0,0,r,0,7);ctx.stroke();
  ctx.fillStyle='rgba(255,255,255,.9)';ctx.beginPath();ctx.ellipse(-r*.42,-r*.48,r*.22,r*.13,-.7,0,7);ctx.fill();
  ctx.rotate(ang);
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(0,0,r*.5,0,7);ctx.fill();
  ctx.lineWidth=2;ctx.stroke();
  ctx.fillStyle=INK;ctx.font=`900 ${b.n>9?15:17}px ${FONT}`;ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(b.n,0,1);
  ctx.restore();
}

function drawSfx(text,x,y,size,angle,fillC){
  ctx.save();ctx.translate(x,y);ctx.rotate(angle);
  ctx.font=`900 ${size}px ${FONT}`;ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.lineJoin='round';ctx.lineWidth=size*.22;ctx.strokeStyle=INK;
  ctx.strokeText(text,4,4);ctx.fillStyle=INK;ctx.fillText(text,4,4);
  ctx.strokeText(text,0,0);ctx.fillStyle=fillC;ctx.fillText(text,0,0);
  ctx.restore();
}

function draw(now){
  ctx.clearRect(0,0,W,H);
  const MAXW=4.4;
  // focus / speed lines while spinning
  if(omega>.4){
    ctx.save();ctx.strokeStyle=INK;ctx.globalAlpha=Math.min(.55,omega/MAXW*.6);
    for(let i=0;i<34;i++){
      const a=Math.random()*Math.PI*2,r0=R+28+Math.random()*20,len=30+Math.random()*70;
      ctx.lineWidth=1+Math.random()*2.5;ctx.beginPath();
      ctx.moveTo(C.x+Math.cos(a)*r0,C.y+Math.sin(a)*r0);ctx.lineTo(C.x+Math.cos(a)*(r0+len),C.y+Math.sin(a)*(r0+len));ctx.stroke();
    }
    ctx.restore();
  }
  // base plate
  poly([[44,618],[578,618],[578,652],[44,652]].map(p=>[p[0]+7,p[1]+7]),INK,0);
  poly([[84,574],[534,574],[578,618],[44,618]],'#ef3d30');
  poly([[44,618],[578,618],[578,652],[44,652]],'#c42a20');
  poly([[44,618],[578,618],[578,652],[44,652]],DOTS,0);
  ctx.strokeStyle='rgba(255,255,255,.6)';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(96,582);ctx.lineTo(300,582);ctx.stroke();
  // support
  poly([[346,448],[374,436],[406,588],[380,600]],'#b8261d');
  poly([[346,448],[374,436],[406,588],[380,600]],DOTS,0);
  poly([[254,448],[346,448],[380,600],[220,600]],'#ef3d30');
  ctx.strokeStyle='rgba(255,255,255,.55)';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(262,462);ctx.lineTo(236,590);ctx.stroke();

  // drum back
  const back=oct(C.x+D.x,C.y+D.y,R,rot),front=oct(C.x,C.y,R,rot);
  poly(back,'rgba(196,228,255,.35)',3,'rgba(27,26,46,.4)');
  // axle
  ctx.strokeStyle='#8b93a3';ctx.lineWidth=8;ctx.beginPath();ctx.moveTo(C.x+D.x,C.y+D.y);ctx.lineTo(C.x,C.y);ctx.stroke();
  ctx.fillStyle='#c7ccd6';ctx.strokeStyle=INK;ctx.lineWidth=2.5;ctx.beginPath();ctx.arc(C.x+D.x,C.y+D.y,10,0,7);ctx.fill();ctx.stroke();
  // balls
  for(const b of balls){const w=toWorld(b);drawBall(w.x,w.y,b,b.a+rot);}
  // side edges
  ctx.strokeStyle='rgba(27,26,46,.75)';ctx.lineWidth=3;
  for(let k=0;k<8;k++){ctx.beginPath();ctx.moveTo(back[k][0],back[k][1]);ctx.lineTo(front[k][0],front[k][1]);ctx.stroke();}
  // front face glass
  ctx.save();ctx.beginPath();front.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath();ctx.clip();
  ctx.fillStyle='rgba(255,255,255,.28)';
  ctx.beginPath();ctx.moveTo(C.x-R,C.y-30);ctx.lineTo(C.x-60,C.y-R);ctx.lineTo(C.x-10,C.y-R);ctx.lineTo(C.x-R,C.y+20);ctx.closePath();ctx.fill();
  ctx.beginPath();ctx.moveTo(C.x-R,C.y+60);ctx.lineTo(C.x+40,C.y-R);ctx.lineTo(C.x+56,C.y-R);ctx.lineTo(C.x-R,C.y+84);ctx.closePath();ctx.fill();
  ctx.restore();
  poly(front,null,5.5);
  const inner=oct(C.x,C.y,R-9,rot);
  ctx.strokeStyle='rgba(255,255,255,.9)';ctx.lineWidth=3;ctx.beginPath();
  ctx.moveTo(inner[3][0],inner[3][1]);ctx.lineTo(inner[4][0],inner[4][1]);ctx.lineTo(inner[5][0],inner[5][1]);ctx.lineTo(inner[6][0],inner[6][1]);ctx.stroke();
  // lid handle at the top edge
  const tm={x:(front[5][0]+front[6][0])/2,y:(front[5][1]+front[6][1])/2};
  ctx.save();ctx.translate(tm.x,tm.y);ctx.rotate(rot);
  ctx.fillStyle='#e9eef6';ctx.strokeStyle=INK;ctx.lineWidth=3;ctx.beginPath();ctx.roundRect(-34,-10,68,14,5);ctx.fill();ctx.stroke();
  ctx.restore();
  // front hub
  ctx.fillStyle='#d9dde5';ctx.strokeStyle=INK;ctx.lineWidth=3;ctx.beginPath();ctx.arc(C.x,C.y,13,0,7);ctx.fill();ctx.stroke();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(C.x-4,C.y-4,4,0,7);ctx.fill();

  // chute (acrylic tube)
  const ux=E.x-S.x,uy=E.y-S.y,L=Math.hypot(ux,uy),nx=-uy/L*(r+7),ny=ux/L*(r+7);
  const ext=18/L;
  const s0={x:S.x-ux*ext,y:S.y-uy*ext},e0={x:E.x+ux*ext*.6,y:E.y+uy*ext*.6};
  poly([[s0.x+nx,s0.y+ny],[e0.x+nx,e0.y+ny],[e0.x-nx,e0.y-ny],[s0.x-nx,s0.y-ny]],'rgba(205,236,255,.4)',0);
  // ball in chute
  if(pulling){const p=pulling;drawBall(p.x,p.y,p.b,p.ang,p.scale||1);}
  if(trayBall){drawBall(E.x,E.y,trayBall,0);}
  ctx.lineWidth=3.5;ctx.strokeStyle=INK;
  ctx.beginPath();ctx.moveTo(s0.x+nx,s0.y+ny);ctx.lineTo(e0.x+nx,e0.y+ny);ctx.stroke();
  ctx.beginPath();ctx.moveTo(s0.x-nx,s0.y-ny);ctx.lineTo(e0.x-nx,e0.y-ny);ctx.stroke();
  ctx.strokeStyle='rgba(255,255,255,.85)';ctx.lineWidth=2.5;
  ctx.beginPath();ctx.moveTo(s0.x-nx*.7,s0.y-ny*.7);ctx.lineTo(e0.x-nx*.7,e0.y-ny*.7);ctx.stroke();
  ctx.beginPath();ctx.ellipse(e0.x,e0.y,7,r+7,Math.atan2(uy,ux),0,7);ctx.strokeStyle=INK;ctx.lineWidth=3;ctx.stroke();

  // crank
  const hub={x:364,y:522},ca=rot*1.6,ex=hub.x+Math.cos(ca)*48,ey=hub.y+Math.sin(ca)*48;
  ctx.lineCap='round';ctx.strokeStyle=INK;ctx.lineWidth=13;ctx.beginPath();ctx.moveTo(hub.x,hub.y);ctx.lineTo(ex,ey);ctx.stroke();
  ctx.strokeStyle='#cfd5df';ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(hub.x,hub.y);ctx.lineTo(ex,ey);ctx.stroke();
  ctx.strokeStyle=INK;ctx.lineWidth=17;ctx.beginPath();ctx.moveTo(ex,ey);ctx.lineTo(ex+18,ey+6);ctx.stroke();
  ctx.strokeStyle='#2b2a3e';ctx.lineWidth=11;ctx.beginPath();ctx.moveTo(ex,ey);ctx.lineTo(ex+18,ey+6);ctx.stroke();
  ctx.lineCap='butt';
  ctx.fillStyle='#ffd43b';ctx.strokeStyle=INK;ctx.lineWidth=3;ctx.beginPath();ctx.arc(hub.x,hub.y,11,0,7);ctx.fill();ctx.stroke();

  // sound effects
  if(state==='spin'){const s=1+Math.sin(now/60)*.06;drawSfx('嘩啦嘩啦！',462,62,40*s,-.16,'#ffd43b');}
  if(sfxText&&now<sfxText.until){drawSfx(sfxText.t,sfxText.x,sfxText.y,46,-.2,'#fff');}
  if(!balls.length&&state==='idle'){drawSfx('全部抽完！',C.x,C.y,48,-.12,'#ffd43b');}
}

// ---------- flow ----------
const go=document.getElementById('go'),goSub=document.getElementById('goSub');
function counts(){
  document.getElementById('cT').textContent=balls.filter(b=>b.q.t==='truth').length;
  document.getElementById('cD').textContent=balls.filter(b=>b.q.t==='dare').length;
  go.disabled=state!=='idle'||!balls.length;
  goSub.textContent=balls.length?'按我抽':'抽完了';
}
function spin(){
  if(state!=='idle'||!balls.length)return;
  audio();startMusic();state='spin';spinT=0;trayBall=null;counts();
}
const ease=t=>1-Math.pow(1-t,3);
function startPull(){
  const i=Math.random()*balls.length|0,b=balls.splice(i,1)[0],w=toWorld(b);
  pulling={b,x:w.x,y:w.y,x0:w.x,y0:w.y,ang:b.a+rot,t:0,phase:'pull'};state='pull';
  tone(420,.08,'square',.05);
}
function updPull(dt){
  const p=pulling;p.t+=dt;
  if(p.phase==='pull'){
    const k=Math.min(1,p.t/(RM?.2:.5)),e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
    p.x=p.x0+(P1.x-p.x0)*e;p.y=p.y0+(P1.y-p.y0)*e;p.ang+=dt*3;
    if(k>=1){p.phase='roll';p.t=0;}
  }else if(p.phase==='roll'){
    const T=RM?.4:.85,k=Math.min(1,p.t/T),e=k*k;
    const l1=Math.hypot(S.x-P1.x,S.y-P1.y),l2=Math.hypot(E.x-S.x,E.y-S.y),d=e*(l1+l2);
    if(d<l1){const f=d/l1;p.x=P1.x+(S.x-P1.x)*f;p.y=P1.y+(S.y-P1.y)*f;}
    else{const f=(d-l1)/l2;p.x=S.x+(E.x-S.x)*f;p.y=S.y+(E.y-S.y)*f;}
    p.ang-=dt*(4+12*k);
    if(k>=1){p.phase='land';p.t=0;sfxText={t:'咚！',x:150,y:500,until:performance.now()+900};tone(180,.18,'sine',.25);tone(90,.25,'sine',.2,.02);}
  }else{
    const T=.45,k=Math.min(1,p.t/T);
    p.x=E.x;p.y=E.y-Math.abs(Math.sin(k*Math.PI*2))*16*(1-k);
    if(k>=1){trayBall=p.b;current=p.b;pulling=null;state='reveal';setTimeout(()=>openReveal(current),RM?100:350);}
  }
}

let last=performance.now();
function loop(now){
  let dt=Math.min(1/30,(now-last)/1000);last=now;
  const MAXW=4.4,T=RM?1.2:2.6;
  if(state==='spin'){
    spinT+=dt;const t=spinT/T;
    omega=MAXW*(t<.22?t/.22:t<.68?1:Math.max(0,(1-t)/.32));
    if(spinT>=T){omega=0;state='settle';const q=Math.PI/4;settle={from:rot,to:Math.ceil(rot/q+.15)*q,t:0};}
  }
  rot+=omega*dt;
  if(state==='settle'){
    settle.t+=dt;const k=Math.min(1,settle.t/.4);rot=settle.from+(settle.to-settle.from)*ease(k);
    if(k>=1){rot=settle.to%(Math.PI*2);startPull();}
  }
  const tickIdx=Math.floor(rot/(Math.PI/8));
  if(tickIdx!==lastTick&&(state==='spin'||state==='settle')){tone(1100+Math.random()*300,.025,'square',.035);}
  lastTick=tickIdx;
  const n=6;for(let i=0;i<n;i++)step(dt/n);
  if(pulling)updPull(dt);
  draw(now);
  requestAnimationFrame(loop);
}

// ---------- reveal ----------
const rev=document.getElementById('reveal'),chest=document.getElementById('chest'),card=document.getElementById('card'),hint=document.getElementById('hint');
const sfxTop=document.getElementById('sfxTop'),sfxLeft=document.getElementById('sfxLeft');
function openReveal(b){
  rev.hidden=false;rev.classList.remove('opened');
  chest.className='chest drop';card.classList.remove('show');hint.style.opacity=1;
  sfxTop.className='sfx';sfxLeft.className='sfx left';
  setTimeout(()=>{sfxTop.className='sfx pop';tone(140,.2,'sine',.25);},RM?50:520);
  setTimeout(()=>{if(!chest.classList.contains('open'))chest.className='chest shake';},RM?100:700);
  chest.focus({preventScroll:true});
}
chest.addEventListener('click',()=>{
  if(chest.classList.contains('open')||!current)return;
  audio();
  chest.className='chest open';rev.classList.add('opened');hint.style.opacity=0;
  sfxTop.className='sfx';sfxLeft.className='sfx left pop';
  [523,659,784,1047].forEach((f,i)=>tone(f,i===3?.5:.14,'triangle',.12,i*.09));
  confetti();
  const b=current,isT=b.q.t==='truth';
  card.style.setProperty('--type',isT?'var(--truth)':'var(--dare)');
  document.getElementById('badge').textContent=isT?'真心話':'大冒險';
  document.getElementById('no').textContent='No.'+String(b.n).padStart(2,'0');
  document.getElementById('qtext').textContent=b.q.q;
  document.getElementById('rule').textContent=isT?'老實回答，不能說謊！':'說到做到，不准反悔！';
  setTimeout(()=>{chest.classList.add('gone');card.classList.add('show');document.getElementById('done').focus({preventScroll:true});},RM?150:650);
});
function confetti(){
  if(RM)return;
  const cols=['#ffd43b','#1d8fe3','#ec3a2e','#2db45c','#e0508f','#fff'];
  const stage=document.querySelector('.stage');
  for(let i=0;i<46;i++){
    const s=document.createElement('span');s.className='conf';
    s.style.background=cols[i%cols.length];const sz=10+Math.random()*16;s.style.width=s.style.height=sz+'px';
    stage.appendChild(s);
    const a=-Math.PI/2+(Math.random()-.5)*2.6,v=180+Math.random()*260;
    s.animate([
      {transform:'translate(-50%,-50%) rotate(0) scale(.4)',opacity:1},
      {transform:`translate(calc(-50% + ${Math.cos(a)*v}px),calc(-50% + ${Math.sin(a)*v}px)) rotate(${Math.random()*720}deg) scale(1)`,opacity:1,offset:.6},
      {transform:`translate(calc(-50% + ${Math.cos(a)*v*1.2}px),calc(-50% + ${Math.sin(a)*v+160}px)) rotate(${Math.random()*900}deg) scale(.9)`,opacity:0}
    ],{duration:1300+Math.random()*700,easing:'cubic-bezier(.2,.8,.4,1)'}).onfinish=()=>s.remove();
  }
}
function closeReveal(){
  rev.hidden=true;state='idle';current=null;counts();go.focus({preventScroll:true});
}
document.getElementById('done').addEventListener('click',closeReveal);
document.getElementById('putback').addEventListener('click',()=>{
  const b=current;trayBall=null;
  b.x=(Math.random()-.5)*60;b.y=-LIM+r;b.vx=0;b.vy=0;balls.push(b);
  closeReveal();
});

// ---------- controls ----------
go.addEventListener('click',spin);
addEventListener('keydown',e=>{
  if(e.code==='Space'&&rev.hidden&&!/BUTTON|INPUT/.test(document.activeElement.tagName)){e.preventDefault();spin();}
});
document.getElementById('reset').addEventListener('click',()=>{
  if(state!=='idle')return;fill();
});
const snd=document.getElementById('snd');let soundOn=true;
snd.addEventListener('click',()=>{soundOn=!soundOn;snd.textContent='音效：'+(soundOn?'開':'關');snd.setAttribute('aria-pressed',soundOn);});

let AC=null;
function audio(){
  if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){AC=null;}}
  if(AC&&AC.state==='suspended')AC.resume().catch(()=>{});
  return AC;
}
// ---------- background music (synthesised chiptune loop) ----------
const mus=document.getElementById('mus');let musicOn=true,musGain=null,musTimer=null,musStep=0,musNext=0;
const MEL=[72,0,76,79,76,0,72,74, 76,0,72,69,72,0,76,0, 77,0,76,74,72,0,69,72, 74,0,71,74,79,0,77,74];
const BASS=[48,55,48,55,45,52,45,52,41,48,41,48,43,50,43,50];
const mf=m=>440*Math.pow(2,(m-69)/12);
function note(f,t,dur,type,vol){
  const o=AC.createOscillator(),g=AC.createGain();
  o.type=type;o.frequency.value=f;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g).connect(musGain);o.start(t);o.stop(t+dur+.03);
}
function schedule(){
  const eighth=60/(state==='spin'?190:132)/2;
  while(musNext<AC.currentTime+.15){
    const i=musStep%32,m=MEL[i];
    if(m)note(mf(m),musNext,eighth*.9,'square',.09);
    if(i%2===0)note(mf(BASS[i/2]),musNext,eighth*1.8,'triangle',.22);
    if(i%4===2){note(5200,musNext,.03,'square',.03);}
    musNext+=eighth;musStep++;
  }
}
function startMusic(){
  if(!musicOn||!audio()||musTimer)return;
  if(!musGain){musGain=AC.createGain();musGain.connect(AC.destination);}
  musGain.gain.setValueAtTime(.35,AC.currentTime);
  musNext=AC.currentTime+.05;musTimer=setInterval(schedule,40);schedule();
}
function stopMusic(){
  clearInterval(musTimer);musTimer=null;
  if(musGain)musGain.gain.setTargetAtTime(0,AC.currentTime,.05);
}
mus.addEventListener('click',()=>{
  musicOn=!musicOn;mus.textContent='音樂：'+(musicOn?'開':'關');mus.setAttribute('aria-pressed',musicOn);
  musicOn?startMusic():stopMusic();
});
addEventListener('pointerdown',e=>{if(!e.target.closest('#mus'))startMusic();});

function tone(f,dur,type='square',vol=.08,when=0){
  if(!soundOn||!AC)return;
  const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime+when;
  o.type=type;o.frequency.value=f;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g).connect(AC.destination);o.start(t);o.stop(t+dur+.03);
}

fill();
requestAnimationFrame(loop);
})();
</script>
